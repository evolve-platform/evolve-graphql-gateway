kind: Added
body: 'Compress responses to clients (gzip, br, zstd, deflate, negotiated via Accept-Encoding, responses of 1KiB and up) and accept compressed request bodies, so a compressing reverse proxy is no longer needed. Tune or disable via traffic_shaping.router.compression in your own config.'
