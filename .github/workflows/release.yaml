name: Release

# Publishes the reusable image to GHCR.
#
#   push to main   -> :main and :sha-<short>   (rolling, for tst)
#   tag v1.2.3     -> :1.2.3, :1.2, :latest    (what projects should pin to)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # One native Namespace runner per architecture, so each leg's Remote Builder is
  # already the right architecture and no QEMU is involved — the Rust compile is
  # far too slow under emulation to build both on one runner. Each leg pushes a
  # digest-only image and the manifest is assembled afterwards.
  #
  # arm64 is load-bearing, not a nice-to-have: it is what developers pull on
  # Apple silicon.
  build:
    name: Build ${{ matrix.platform }}
    runs-on:
      # 22.04 on purpose: 24.04+ profiles link against GLIBC_2.38/2.39.
      - nscloud-ubuntu-22.04-${{ matrix.arch }}-8x16
      - nscloud-git-mirror-5gb
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No setup-buildx-action and no cache-from/cache-to: on Namespace runners
      # the default builder is already a Remote Builder for this architecture, and
      # it keeps layer cache on its own volume.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Keep the leg single-manifest so push-by-digest yields one digest to
          # hand to the merge job.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # The manifest job needs the digests, and artifacts are the only channel
      # between matrix legs. Name each file after the bare digest.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish manifest
    runs-on:
      - nscloud-ubuntu-22.04-amd64-2x4
      - nscloud-git-mirror-5gb
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
          # `latest` only for tagged releases, never for a main build.
          flavor: latest=false

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Tag as latest
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_NAME}:latest" \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      # A silently amd64-only manifest would only be discovered by whoever next
      # docker-pulls on an Apple silicon laptop. Fail the release instead.
      - name: Assert the manifest covers both platforms
        run: |
          set -euo pipefail
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          platforms=$(docker buildx imagetools inspect --raw "${tag}" \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u)
          echo "${platforms}"
          for want in linux/amd64 linux/arm64; do
            printf '%s\n' "${platforms}" | grep -qx "${want}" || {
              echo "manifest ${tag} is missing ${want}" >&2
              exit 1
            }
          done
