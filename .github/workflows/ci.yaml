name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Lint & test
    runs-on:
      # 22.04 on purpose: 24.04+ profiles link against GLIBC_2.38/2.39.
      - nscloud-ubuntu-22.04-amd64-8x16-with-cache
      - nscloud-git-mirror-5gb
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-${{ github.repository_owner }}-${{ github.event.repository.name }}-cargo-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # hive-router is a large git dependency; caching its compile is what keeps
      # this job in the single-digit minutes. On Namespace the cache is a volume
      # mount rather than a tarball restore, so it must be mounted before
      # anything writes to ~/.cargo or ~/.rustup — hence before rustup.
      - uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: rust

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Both architectures are built and booted natively. arm64 is not optional here:
  # it is what developers run locally on Apple silicon, so an aarch64 build or
  # runtime break has to fail a PR rather than surface at release time.
  image:
    name: Image ${{ matrix.arch }}
    runs-on:
      - nscloud-ubuntu-22.04-${{ matrix.arch }}-8x16
      - nscloud-git-mirror-5gb
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-buildx-action, no setup-qemu-action and no cache-from/cache-to:
      # on Namespace runners the default builder is already a Remote Builder for
      # this runner's own architecture, and it keeps layer cache on its own volume.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: evolve-gateway:ci

      # Boots the image the way a project would: standard config, secrets from
      # the environment, supergraph from a mounted file. Catches config template
      # regressions that unit tests cannot (YAML shape, plugin deserialization).
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name gw -p 4000:4000 \
            -e JWT_ISSUER=http://localhost:4000 \
            -e JWT_AUDIENCE=http://localhost:4000 \
            -e COOKIE_DOMAIN=localhost \
            -e CORS_ORIGINS='["http://localhost:3000"]' \
            -e FEDERATED_TOKEN_ENCRYPT_KEY_1='dev-only-encrypt-key-00000000000' \
            -e FEDERATED_TOKEN_SIGN_KEY_1='dev-only-sign-key-00000000000000' \
            -e FEDERATED_TOKEN_COOKIE_SECURE=false \
            -e SUPERGRAPH_FILE_PATH=/supergraph.graphql \
            -v "$PWD/examples/supergraph.graphql:/supergraph.graphql:ro" \
            evolve-gateway:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              echo "gateway healthy"
              exit_code=0
              break
            fi
            exit_code=1
            sleep 2
          done

          if [ "${exit_code}" -ne 0 ]; then
            echo "gateway did not become healthy" >&2
            docker logs gw >&2
            exit 1
          fi

          # The plugin is compiled in, not loaded at runtime — assert it actually
          # registered, so a bad config silently disabling it fails the build.
          docker logs gw 2>&1 | grep -q "Plugin 'federated_token' successfully enabled"

          # Credentialed CORS preflight must be answered for the configured origin.
          curl -fsS -X OPTIONS http://127.0.0.1:4000/graphql \
            -H 'Origin: http://localhost:3000' \
            -H 'Access-Control-Request-Method: POST' \
            -D - -o /dev/null | grep -qi 'access-control-allow-origin: http://localhost:3000'

      - name: Assert the gateway refuses to start without its secrets
        run: |
          set -euo pipefail
          if docker run --rm \
              -e SUPERGRAPH_FILE_PATH=/supergraph.graphql \
              -v "$PWD/examples/supergraph.graphql:/supergraph.graphql:ro" \
              evolve-gateway:ci 2>&1 | tee /tmp/out; then
            echo "expected a non-zero exit when required variables are unset" >&2
            exit 1
          fi
          grep -q 'missing required environment variable' /tmp/out

      - name: Container logs
        if: failure()
        run: docker logs gw || true
